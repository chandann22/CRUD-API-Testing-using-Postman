$kind: http-request
url: "{{base_url}}/api/employees"
method: POST
headers:
  Content-Type: application/json
  Authorization: Bearer {{token}}
body:
  type: json
  content: |-
    {
      "name": "Rahul Sharma",
      "email": "missingdesig@gmail.com",
      "phone": "9876543210",
      "department": "IT",
      "salary": 50000,
      "joining_date": "2026-09-21"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("Missing designation should return 400", function () {
          pm.response.to.have.status(400);
      });

      pm.test("Response is valid JSON", function () {
          pm.response.to.be.json;
      });
    language: text/javascript
order: 9000
