$kind: http-request
url: "{{base_url}}/api/login"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "username": "wronguser",
      "password": "admin123"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("Invalid username should return 401", function () {
          pm.response.to.have.status(401);
      });

      pm.test("Response is valid JSON", function () {
          pm.response.to.be.json;
      });
    language: text/javascript
order: 2000
